spring.application.name=gateway-service

spring.cloud.gateway.server.webflux.routes[0].id=identity-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://identity-service:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=identity-teamadmin
spring.cloud.gateway.server.webflux.routes[1].uri=http://identity-service:8081
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/teamadmin/**

spring.cloud.gateway.server.webflux.routes[2].id=data-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://data-service-1:8080
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/**

spring.cloud.gateway.server.webflux.routes[3].id=data-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://data-service-1:8080
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/dashboard/**

# CORS — browser loads the React app from localhost:3000, gateway is the entry point
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:3000 #change this when launching to prod
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

# JWT secret must match identity-service's jwt.secret when using local verification
jwt.secret=${JWT_SECRET:change_me_replace_with_env_secret}
# Optional: JWKS URI for RS256 tokens. If set, gateway will use JWKS/RS256 validation instead of HMAC secret.
jwt.jwks-uri=${JWT_JWKS_URI:}
# Optional issuer and audience checks (set to tighten validation)
jwt.issuer=${JWT_ISSUER:}
jwt.audience=${JWT_AUDIENCE:}



spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}

management.endpoints.web.exposure.include=health,info,gateway,prometheus
management.endpoint.gateway.enabled=true

# Micrometer / tracing settings
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}
# Micrometer tracing sampling probability (0.0-1.0)
management.tracing.sampling.probability=0.1

spring.security.user.name=dev
spring.security.user.password=devpass
