spring.application.name=identity-service
server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}

management.endpoints.web.exposure.include=health,info,prometheus

spring.security.user.name=dev
spring.security.user.password=devpass

# Micrometer / tracing settings
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=0.1

# JWT settings
jwt.secret=${JWT_SECRET:change_me_replace_with_env_secret}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.apikey-expiration-ms=${JWT_APIKEY_EXPIRATION_MS:900000}
jwt.issuer=${JWT_ISSUER:}
jwt.audience=${JWT_AUDIENCE:}