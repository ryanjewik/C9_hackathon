services:
  # ===========================================
  # React Frontend
  # ===========================================
  vod-frontend:
    build:
      context: ./vod_frontend
      dockerfile: Dockerfile
    image: vod-processor-frontend:latest
    container_name: vod-processor-frontend
    ports:
      - "3000:80"
    depends_on:
      - vod-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # VOD Processor API Service
  # ===========================================
  vod-api:
    build:
      context: ./vod_processor
      dockerfile: Dockerfile
      target: production
    image: vod-processor:latest
    container_name: vod-processor-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-cloud9}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - REDIS_URL=redis://redis:6379/0
      - UPLOAD_DIR=/app/uploads
      - OUTPUT_DIR=/app/outputs
      - MAX_UPLOAD_SIZE_MB=5000
      - USE_GPU=true
      - PYTHONPATH=/app
    volumes:
      - vod_uploads:/app/uploads
      - vod_outputs:/app/outputs
      - ./vod_processor/logs:/app/logs
      - ./vod_processor:/app/vod_processor:ro
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    # Enable NVIDIA GPU support
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # Celery Worker for Background Processing
  # ===========================================
  vod-worker:
    build:
      context: ./vod_processor
      dockerfile: Dockerfile
      target: production
    image: vod-processor:latest
    container_name: vod-processor-worker
    command: celery -A app.worker worker --loglevel=info --concurrency=2
    environment:
      - PYTHONUNBUFFERED=1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_URL=redis://redis:6379/0
      - UPLOAD_DIR=/app/uploads
      - OUTPUT_DIR=/app/outputs
      - USE_GPU=true
      - PYTHONPATH=/app
      # GPU configuration for PaddlePaddle
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - FLAGS_fraction_of_gpu_memory_to_use=0.8
    volumes:
      - vod_uploads:/app/uploads
      - vod_outputs:/app/outputs
      - ./vod_processor/logs:/app/logs
      # Mount test VOD files directly (no need to docker cp)
      - ./vod_processor/match_vod.mp4:/app/uploads/match_vod.mp4:ro
      - ./vod_processor/match_vod_2.mp4:/app/uploads/match_vod_2.mp4:ro
      - ./vod_processor/match_vod_3.mp4:/app/uploads/match_vod_3.mp4:ro
      - ./vod_processor/match_vod_4.mp4:/app/uploads/match_vod_4.mp4:ro
      - ./vod_processor/match_vod_5.mp4:/app/uploads/match_vod_5.mp4:ro
      - ./vod_processor/match_vod_6.mp4:/app/uploads/match_vod_6.mp4:ro
      - ./vod_processor/match_vod_7.mp4:/app/uploads/match_vod_7.mp4:ro
      - ./vod_processor/match_vod_8.mp4:/app/uploads/match_vod_8.mp4:ro
      - ./vod_processor/match_vod_9.mp4:/app/uploads/match_vod_9.mp4:ro
      - ./vod_processor/match_vod_10.mp4:/app/uploads/match_vod_10.mp4:ro
      - ./vod_processor/match_vod_11.mp4:/app/uploads/match_vod_11.mp4:ro
      - ./vod_processor/match_vod_12.mp4:/app/uploads/match_vod_12.mp4:ro
      - ./vod_processor/match_vod_13.mp4:/app/uploads/match_vod_13.mp4:ro
      - ./vod_processor/match_vod_14.mp4:/app/uploads/match_vod_14.mp4:ro
      # Mount source code for live development (no need to rebuild/copy)
      - ./vod_processor/app:/app/app:ro
      - ./vod_processor/config:/app/config:ro
      - ./vod_processor:/app/vod_processor:ro
      # Mount valorant_resources so model + labels are available
      - ./valorant_resources:/app/valorant_resources:ro
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    # Enable NVIDIA GPU support for OCR acceleration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # One-off runner to extract and save killfeed crops (uses same image)
  crops-runner:
    image: vod-processor:latest
    container_name: vod-processor-crops-runner
    build:
      context: ./vod_processor
      dockerfile: Dockerfile
      target: crops
    command: ["/bin/bash", "-lc", "python /app/vod_processor/tools/save_killfeed_crops.py --video /app/uploads/match_vod.mp4 --out /app/outputs/crops --sample-rate 5 --max-crops 100 --debug --skip-seconds 420 --device cpu"]
    environment:
      - PYTHONUNBUFFERED=1
      - UPLOAD_DIR=/app/uploads
      - OUTPUT_DIR=/app/outputs
      - USE_GPU=false
      - DISABLE_OCR=true
      - PYTHONPATH=/app
    volumes:
      - vod_uploads:/app/uploads
      - ./vod_processor/outputs:/app/outputs
      - ./vod_processor/logs:/app/logs
      - ./vod_processor/match_vod.mp4:/app/uploads/match_vod.mp4:ro
      - ../valorant_resources:/app/valorant_resources:ro
      - ./vod_processor:/app/vod_processor:ro
      - ./vod_processor/app:/app/app:ro
      - ./vod_processor/config:/app/config:ro
    depends_on:
      - redis
      - postgres
    restart: "no"

  # ===========================================
  # VLR Scraper: Celery Worker
  # ===========================================
  scraper-worker:
    build:
      context: ./scraping_job
      dockerfile: Dockerfile
    image: vlr-scraper:latest
    container_name: vlr-scraper-worker
    command: celery -A celery_app worker --loglevel=info --concurrency=1
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-cloud9}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  # ===========================================
  # VLR Scraper: Celery Beat Scheduler
  # ===========================================
  scraper-beat:
    image: vlr-scraper:latest
    container_name: vlr-scraper-beat
    command: celery -A celery_app beat --loglevel=info
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-cloud9}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    depends_on:
      - redis
      - scraper-worker
    restart: unless-stopped

  # ===========================================
  # Redis for Task Queue
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: vod-processor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # PostgreSQL Database
  # Uses existing backup.sql from project root
  # ===========================================
  postgres:
    image: postgres:17-alpine
    container_name: vod-processor-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5433:5432"  # Use 5433 to avoid conflicts with host postgres
    volumes:
    - postgres_data:/var/lib/postgresql/data
    # Mount restore script and backup file
    - ./vod_processor/db_init/restore.sh:/docker-entrypoint-initdb.d/00-restore.sh:ro
    - ./backup.sql:/docker-entrypoint-initdb.d/backup.sql:ro
    - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    - ./users_schema.sql:/docker-entrypoint-initdb.d/users_schema.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vod_uploads:
  vod_outputs:
  redis_data:
  postgres_data:

networks:
  default:
    name: vod-processor-network
